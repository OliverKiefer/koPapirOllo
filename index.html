<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login" id="login">
            <input type="text" id="username" class="username" placeholder="Add meg a neved"> <br>
            <input type="email" id="email" class="email" placeholder="Add meg az email címed"> <br>
            <button class="loginButton" onclick="login()">Belépés</button>
            <p id="approved" class="approved"></p>
        </div>
        <h1>Kő - Papír - Olló</h1>
        <h2>Válassz!</h2>
        <div class="choices">
            <img src="img/ko.png" alt="Kő" id="rock" class="choice" onclick="jatek('ko')">
            <img src="img/papir.png" alt="Papír" id="paper" class="choice" onclick="jatek('papir')">
            <img src="img/ollo.png" alt="Olló" id="scissors" class="choice" onclick="jatek('ollo')">
        </div>
        <h2>Gép választása</h2>
        <div class="computer-choice">
            <img id="computerChoiceImg" class="choice" alt="computer-choice">
        </div>
        <h1 id="result"></h1>
        <h2>Te pontod</h2>
        <p id="player-score">0</p>
        <h2>Gép pontja</h2>
        <p id="computer-score">0</p>

        <button id="reset" class="resetButton" onclick="resetGame()">Új játék</button>
        <p id="final" class="final"></p>
    </div>
    <script src="js.js"></script>
</body>
</html>
