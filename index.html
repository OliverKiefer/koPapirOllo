<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kő - Papír - Olló</h1>
        <h2>Válassz!</h2>
        <div class="choices">
            <img src="img/ko.png" alt="Kő" id="rock" class="choice" onclick="jatek('ko')">
            <img src="img/papir.png" alt="Papír" id="paper" class="choice" onclick="jatek('papir')">
            <img src="img/ollo.png" alt="Olló" id="scissors" class="choice" onclick="jatek('ollo')">
        </div>
        <h2>Gép választása</h2>
        <div class="computer-choice">
            <img src="img/ollo.png" alt="Olló" id="computerChoiceImg" class="choice">
        </div>
        <h1 id="result">Eredmény: Te nyertél!</h1>
        <h3>Te pontod</h3>
        <p id="player-score">2</p>
        <h3>Gép pontja</h3>
        <p id="computer-score">8</p>
    </div>
    <script src="js.js"></script>
</body>
</html>
